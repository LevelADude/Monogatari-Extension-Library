name: Extension CI Samples

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * *'

jobs:
  samples:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run sample CI
        run: bash scripts/ci_run_samples.sh

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-out
          path: ci_out/
